[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "changedetection.io-camofox-browser"
version = "0.1.0"
description = "changedetection.io content fetcher plugin backed by the camofox-browser REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alex Ferrari" }]
keywords = ["changedetection.io", "camofox", "camoufox", "web-monitoring", "anti-bot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "changedetection.io>=0.55.3",
]

[project.urls]
Homepage = "https://github.com/alexferrari88/changedetection.io-camofox-browser"
Repository = "https://github.com/alexferrari88/changedetection.io-camofox-browser"
Issues = "https://github.com/alexferrari88/changedetection.io-camofox-browser/issues"

[project.entry-points.changedetectionio]
camofox_browser = "changedetectionio_camofox_browser.fetcher"

[tool.hatch.build.targets.wheel]
packages = ["changedetectionio_camofox_browser"]
